<svg xmlns="http://www.w3.org/2000/svg" width="480" height="142" viewBox="0 0 480 142" role="img"><title>Espacio</title><style>
@keyframes ticker{to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bar-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes reveal{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes portrait{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes cell{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
[data-reveal]{animation:reveal 1s cubic-bezier(.2,.8,.2,1) both !important}
.availability{animation:reveal .9s cubic-bezier(.2,.8,.2,1) .1s both !important}
.hero h1{animation:reveal 1s cubic-bezier(.2,.8,.2,1) .25s both !important}
.hero-copy>p{animation:reveal 1s cubic-bezier(.2,.8,.2,1) .45s both !important}
.portrait-frame{animation:portrait 1.4s cubic-bezier(.2,.8,.2,1) .2s both !important}
.hero-actions a{animation:reveal .9s cubic-bezier(.2,.8,.2,1) .6s both !important}
.contact-heading,.contact-intro{animation:reveal 1s cubic-bezier(.2,.8,.2,1) both !important}
.contact-intro{animation-delay:.25s !important}
.contact-primary,.contact-secondary a{animation:reveal .9s cubic-bezier(.2,.8,.2,1) both !important}
@keyframes slide{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(3px,-3px)}}
@keyframes type{from{clip-path:inset(-12px 100% -16px 0)}to{clip-path:inset(-12px 0 -16px 0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* Technologies: encabezado y filas que entran en cascada */
.capability-section>header{animation:reveal 1s cubic-bezier(.2,.8,.2,1) both !important}
.capability-list article[data-reveal]{animation:slide .8s cubic-bezier(.2,.8,.2,1) both !important}
.capability-list article[data-reveal]:nth-child(2){animation-delay:.12s !important}
.capability-list article[data-reveal]:nth-child(3){animation-delay:.24s !important}
.capability-list article[data-reveal]:nth-child(4){animation-delay:.36s !important}
.capability-list article[data-reveal]:nth-child(5){animation-delay:.48s !important}
/* Credenciales: el título entra después de la etiqueta */
.credential-list>a h3{animation:slide .9s cubic-bezier(.2,.8,.2,1) .15s both !important}
.credential-list>a time{animation:fade 1s ease .35s both !important}
/* Microsoft Learn: cabecera, tarjetas escalonadas por columna */
.learn-paths-head>div{animation:slide .9s cubic-bezier(.2,.8,.2,1) both !important}
.learn-paths-grid>a[data-reveal]:nth-child(even){animation-delay:.15s !important}
.learn-paths-grid h4{animation:fade 1s ease .25s both !important}
/* flechas: pequeño impulso periódico, como el hover de la web */
.credential-list .arrow,.learn-paths .arrow,.case-link .arrow{animation:nudge 2.8s ease-in-out 1s infinite !important}
/* Contacto: titular, correo que se escribe y tarjetas en cascada */
.contact-heading h2{animation:reveal 1s cubic-bezier(.2,.8,.2,1) .1s both !important}
.contact-primary strong{animation:type 1.8s steps(36,end) .4s both !important}
.contact-primary>span,.contact-primary>small{animation:fade .8s ease both !important}
.contact-secondary a:nth-child(2){animation-delay:.15s !important}
.contact-secondary strong{animation:slide .9s cubic-bezier(.2,.8,.2,1) .2s both !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
/* WebKit (Safari en Mac, iPhone y iPad; cualquier navegador en iOS): las capas animadas dentro de
   foreignObject no siguen el escalado del SVG y se ven gigantes, desplazadas o vacías. Ahí se muestra
   el estado final sin animación; Chrome, Edge y Firefox (PC y Android) conservan las animaciones. */
@supports (-webkit-touch-callout:none) or (font:-apple-system-body) or (-apple-pay-button-style:inherit){*,*::before,*::after{animation:none !important;will-change:auto !important}}
</style><rect width="480" height="142" fill="#FFFFFF"/></svg>
